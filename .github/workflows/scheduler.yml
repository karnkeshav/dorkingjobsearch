name: Director-Level Job Radar

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  job-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Job Discovery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p logs
          python scripts/main.py > logs/latest.log 2>&1
          cat logs/latest.log

      - name: Commit and Push State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Only commit if data/seen_jobs.json changed
          if [[ -n $(git status -s data/seen_jobs.json) ]]; then
            git add data/seen_jobs.json
            git commit -m "Update seen jobs [skip ci]"
            # Explicitly push to the current branch (HEAD) on origin
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to seen_jobs.json"
          fi
